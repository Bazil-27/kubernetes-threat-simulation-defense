apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvwa
  namespace: vuln-apps
  labels:
    app: dvwa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dvwa
  template:
    metadata:
      labels:
        app: dvwa
    spec:
      containers:
        - name: dvwa
          image: cytopia/dvwa:latest
          ports:
            - containerPort: 80
          env:
            - name: MYSQL_HOSTNAME
              value: "127.0.0.1"
            - name: MYSQL_USERNAME
              value: "dvwa"
            - name: MYSQL_PASSWORD
              value: "dvwa"
            - name: MYSQL_DATABASE
              value: "dvwa"
          resources:
            limits:
              cpu: "500m"
              memory: "768Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
        - name: mysql
          image: docker.io/library/mariadb:10.6
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "rootpass"
            - name: MYSQL_DATABASE
              value: "dvwa"
            - name: MYSQL_USER
              value: "dvwa"
            - name: MYSQL_PASSWORD
              value: "dvwa"
          resources:
            limits:
              cpu: "500m"
              memory: "768Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dvwa
  namespace: vuln-apps
spec:
  type: NodePort
  selector:
    app: dvwa
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000