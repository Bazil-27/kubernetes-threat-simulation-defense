# MISCONFIG 2: Wildcard RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: over-privileged-sa
  namespace: vuln-apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: over-privileged-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: over-privileged-sa
    namespace: vuln-apps