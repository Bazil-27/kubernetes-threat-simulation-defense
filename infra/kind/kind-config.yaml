kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubredops
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000
        hostPort: 30000
      - containerPort: 30001
        hostPort: 30001
      - containerPort: 30002
        hostPort: 30002
      - containerPort: 31000
        hostPort: 31000
      - containerPort: 31001
        hostPort: 31001
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            "feature-gates": ""
  - role: worker
  - role: worker